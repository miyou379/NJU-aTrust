on:
  push:
    branches: [main]

jobs:
  rpm-build:
    runs-on: ubuntu-24.04
    container:
      image: fedora:latest
    steps:
      - run: dnf install -y rpm-build redhat-rpm-config rpmautospec
      - run: dnf builddep -y ./atrust-rpm.spec
      - run: sh ./build.sh
      - run: ls | grep "aTrust-*"
    
